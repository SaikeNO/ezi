[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcrawler-studio-backend"
version = "0.3.0"
description = "WebCrawler Studio API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "httpcore==1.0.9",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
